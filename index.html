<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dinner planner</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2d6a4f">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dinners">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f1;--card:#fff;--ink:#1c2a23;--mute:#667269;--line:#dce4da;--acc:#2d6a4f;--acc-ink:#fff;--soft:#e2efe6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--card:#1c2521;--ink:#e8efe9;--mute:#98a59c;--line:#2c3832;--acc:#6cc39a;--acc-ink:#0f1a14;--soft:#223a2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a17;--card:#1c2521;--ink:#e8efe9;--mute:#98a59c;--line:#2c3832;--acc:#6cc39a;--acc-ink:#0f1a14;--soft:#223a2e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
h2{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0}
h3{font-size:15px;font-weight:600;margin:18px 0 6px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.tabs button{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 16px;font-weight:600}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:22px}
.day{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;min-height:56px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.day b{font-size:14px}
.day span{font-size:18px;line-height:1.1;min-height:20px}
.day.has{background:var(--soft);border-color:transparent}
.day.has span{color:var(--ink)}
.day.sel{outline:2px solid var(--acc);outline-offset:1px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sub{color:var(--mute);font-size:14px;margin:2px 0 0}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;white-space:nowrap}
.cards{display:grid;gap:10px}
.card{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.card .em{font-size:34px;grid-row:span 2}
.card .nm{font-weight:800;font-size:17px}
.card .ing{grid-column:2/4;color:var(--mute);font-size:13px}
.card .tm{background:var(--soft);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.card.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.card.on .ing{color:inherit;opacity:.85}
.card.on .tm{background:rgba(255,255,255,.22);color:inherit}
.recipe{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:20px}
.recipe .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.recipe ul,.recipe ol{margin:0;padding-left:22px}
.recipe li{margin:4px 0}
.recipe ol li::marker{font-weight:800;color:var(--acc)}
.cols{display:grid;gap:4px 28px}
@media(min-width:620px){.cols{grid-template-columns:1fr 1.4fr}}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:12px;font-weight:600}
summary::-webkit-details-marker{display:none}
summary .tm{margin-left:auto;color:var(--mute);font-size:14px;font-weight:400}
details .recipe{border:0;margin:0;padding:0 16px 16px;border-top:1px solid var(--line);border-radius:0}
.empty{color:var(--mute);margin-top:20px}
.week{gap:4px}
.wh{text-align:center;font-size:12px;font-weight:600;color:var(--mute)}
.day.today{border-color:var(--acc)}
.day.today b{color:var(--acc)}
.other{display:grid;gap:6px;margin-top:14px;font-weight:600;font-size:14px}
.other select{font:inherit;font-weight:400;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.other select:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.mnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mnav h2{flex:1;font-size:20px}
.mnav .ghost{padding:6px 12px}
.form{display:grid;gap:12px;margin-top:14px}
.form label{display:grid;gap:4px;font-weight:600;font-size:14px}
.form input,.form textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.form input:focus-visible,.form textarea:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.form .row{display:grid;grid-template-columns:90px 1fr;gap:12px}
.form .save{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);justify-self:start}
.err{color:#b3261e;margin:0;min-height:1.3em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#ff8a80}}
:root[data-theme="dark"] .err{color:#ff8a80}
.bar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lang{display:flex;gap:4px;padding-top:6px}
.lang button{border:1px solid var(--line);background:none;border-radius:8px;padding:5px 10px;font-weight:600;font-size:13px}
.lang button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
</style>
</head>

  return `<div class="recipe"><div class="top"><div><h2>${d.e} ${d.n}</h2><p class="sub">${d.t} ${U().min}, ${U().serves}</p></div></div>
  <div class="cols"><div><h3>${U().ing}</h3><ul>${I.map(x=>`<li>${x}</li>`).join("")}</ul></div>
  <div><h3>${U().how}</h3><ol>${St.map(x=>`<li>${x}</li>`).join("")}</ol></div></div></div>`;
}
function title(k){const s=parse(k).toLocaleDateString(S.lang==="no"?"nb-NO":"en-GB",{weekday:"long",day:"numeric",month:"long"});return s.charAt(0).toUpperCase()+s.slice(1)}
function cal(){
  const [y,m]=S.view.split("-").map(Number),today=key(new Date());
  const first=new Date(y,m-1,1),lead=(first.getDay()+6)%7,n=new Date(y,m,0).getDate();
  let c=DAYS.map(x=>`<b class="wh">${x}</b>`).join("");
  for(let i=0;i<lead;i++)c+="<i></i>";
  for(let k=1;k<=n;k++){
    const ky=key(new Date(y,m-1,k)),p=S.pick[ky]?get(S.pick[ky]):null;
    c+=`<button class="day${p?" has":""}${ky===S.day?" sel":""}${ky===today?" today":""}" data-day="${ky}" aria-label="${title(ky)}${p?", "+p.n:""}"><b>${k}</b><span>${p?p.e:""}</span></button>`;
  }
  const mt=first.toLocaleDateString(S.lang==="no"?"nb-NO":"en-GB",{month:"long",year:"numeric"});
  return `<div class="mnav"><button class="ghost" data-mv="-1" aria-label="${U().prev}">‹</button><h2>${mt.charAt(0).toUpperCase()+mt.slice(1)}</h2><button class="ghost" data-mv="1" aria-label="${U().next}">›</button><button class="ghost" data-today>${U().today}</button></div><div class="week">${c}</div>`;
}
function plan(){
  const d=S.day;
  if(!A().length)return `<p class="empty">${U().noDin}</p>`;if(!S.sug[d])suggest(d);
  const picked=S.pick[d]?get(S.pick[d]):null;
  let h=cal()+`
  <div class="head"><div><h2>${title(d)}</h2><p class="sub">${picked?U().set:U().choose}</p></div><button class="ghost" data-shuffle>${U().shuffle}</button></div>
  <div class="cards">${S.sug[d].map(id=>{const x=get(id);const on=S.pick[d]===id;
    return `<button class="card${on?" on":""}" data-pick="${id}" aria-pressed="${on}"><span class="em">${x.e}</span><span class="nm">${x.n}</span><span class="tm">${x.t} ${U().min}</span><span class="ing">${x.i.split("|").slice(0,4).map(s=>s.replace(/^[\d\/., ]+(g|kg|dl|ml|tbsp|tsp|ss|ts|packet|pack|can|pose|boks|pakke|neve|handful)?\b ?/,"").replace(/ \(.*\)/,"")).join(", ")} ${U().more}</span></button>`}).join("")}</div>
  <label class="other">${U().other}<select data-other><option value="">${U().anyph}</option>${A().map(T).sort((a,b)=>a.n.localeCompare(b.n,S.lang==="no"?"nb":"en")).map(x=>`<option value="${x.id}">${x.e} ${x.n}</option>`).join("")}</select></label>`;
  if(picked)h+=recipe(picked)+`<p><button class="ghost" data-clear style="margin-top:12px">${U().clear(title(d))}</button></p>`;
  else h+=`<p class="empty">${U().pickAbove}</p>`;
  return h;
}
function form(){
  const u=U();
  return `<h2>${u.add}</h2><p class="sub">${u.addSub}</p><div class="form"><label>${u.fname}<input id="f-n" maxlength="60" autocomplete="off"></label><div class="row"><label>${u.femoji}<input id="f-e" maxlength="8" placeholder="🍲"></label><label>${u.ftime}<input id="f-t" type="number" min="1" max="600" inputmode="numeric"></label></div><label>${u.fing}<textarea id="f-i" rows="6"></textarea></label><label>${u.fsteps}<textarea id="f-s" rows="6"></textarea></label><p class="err" id="f-err" role="alert"></p><button class="ghost save" data-save>${u.save}</button></div>`;
}
function add(){
  const v=id=>document.getElementById(id).value.trim();
  const esc=x=>x.replace(/\|/g,"/").replace(/[&<>"]/g,c=>"&#"+c.charCodeAt(0)+";");
  const ls=(id,num)=>v(id).split("\n").map(x=>esc(x.replace(num?/^\s*(\d+[.)]|[-•*])\s*/:/^\s*[-•*]\s*/,"").trim())).filter(Boolean);
  const n=esc(v("f-n")),t=parseInt(v("f-t"),10),i=ls("f-i"),s=ls("f-s",1);
  if(!n||!(t>0)||!i.length||!s.length){document.getElementById("f-err").textContent=U().ferr;return false}
  const id=Date.now();
  C.push({id,e:esc(v("f-e"))||"🍽️",n,t,i:i.join("|"),s:s.join("|"),c:1});
  S.added=id;saveC();return true;
}
function all(){
  return A().map(T).sort((a,b)=>a.t-b.t).map(d=>`<details${d.id===S.added?" open":""}><summary><span style="font-size:26px">${d.e}</span>${d.n}<span class="tm">${d.t} ${U().min}</span></summary>${recipe(d)}<p style="padding:0 16px 14px;margin:0"><button class="ghost" data-del="${d.id}">${U().del}</button></p></details>`).join("")+(H.length?`<button class="ghost" data-restore style="margin-top:8px">${U().restore(H.length)}</button>`:"");
}
document.addEventListener("change",e=>{
  const s=e.target;if(!s.matches||!s.matches("select[data-other]")||!s.value)return;
  const id=+s.value,d=S.day;
  S.pick[d]=id;S.sug[d]=[id,...(S.sug[d]||[]).filter(x=>x!==id).slice(0,2)];
  save();render();
});
function render(){DAYS=U().days;FULL=U().full;document.documentElement.lang=S.lang;document.title=U().title;
  document.getElementById("app").innerHTML=`<div class="bar"><h1>${U().title}</h1><div class="lang" role="group" aria-label="Language"><button data-lang="en" class="${S.lang==="en"?"on":""}">EN</button><button data-lang="no" class="${S.lang==="no"?"on":""}">NO</button></div></div><div class="tabs"><button data-tab="plan" class="${S.tab==="plan"?"on":""}">${U().plan}</button><button data-tab="all" class="${S.tab==="all"?"on":""}">${U().all} (${A().length})</button><button data-tab="add" class="${S.tab==="add"?"on":""}">${U().add}</button></div>`+(S.tab==="plan"?plan():S.tab==="add"?form():all());
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const q=a=>b.hasAttribute("data-"+a);
  if(q("tab"))S.tab=b.dataset.tab;
  else if(q("lang")){S.lang=b.dataset.lang;save();}
  else if(q("save")){if(!add())return;S.tab="all";}
  else if(q("restore")){H=[];saveH();S.sug={};}
  else if(q("del")){
    if(!b.dataset.armed){b.dataset.armed="1";b.textContent=U().sure;return}
    const id=+b.dataset.del;if(C.some(d=>d.id===id)){C=C.filter(d=>d.id!==id);saveC()}else{H.push(id);saveH()}
    for(const k in S.pick)if(S.pick[k]===id&&(k>=key(new Date())||!ALL().some(d=>d.id===id)))delete S.pick[k];
    S.sug={};save();
  }
  else if(q("day")){S.day=b.dataset.day;S.view=S.day.slice(0,7)}
  else if(q("mv")){const [y,m]=S.view.split("-").map(Number);S.view=key(new Date(y,m-1+ +b.dataset.mv,1)).slice(0,7)}
  else if(q("today")){S.day=key(new Date());S.view=S.day.slice(0,7)}
  else if(q("shuffle"))suggest(S.day);
  else if(q("pick")){S.pick[S.day]=+b.dataset.pick;save();}
  else if(q("clear")){delete S.pick[S.day];save();}
  else return;
  render();
});
render();
</script>
<script>
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
